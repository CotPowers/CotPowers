<svg xmlns="http://www.w3.org/2000/svg" width="800" height="270" viewBox="0 0 800 270" role="img" aria-label="Estadísticas de GitHub de CotPowers">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1b27"/>
      <stop offset="1" stop-color="#16161e"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7aa2f7"/>
      <stop offset="1" stop-color="#bb9af7"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .t { font-size: 20px; font-weight: 600; fill: #c0caf5; }
    .n { font-size: 38px; font-weight: 700; fill: url(#acc); }
    .l { font-size: 13px; fill: #9aa5ce; }
    .s { font-size: 12px; fill: #565f89; }
  </style>
  <rect x="1" y="1" width="798" height="268" rx="16" fill="url(#bg)" stroke="#2a2e45" stroke-width="2"/>
  <text x="32" y="44" class="t">Estadísticas de GitHub</text>
  <text x="768" y="44" class="s" text-anchor="end">@CotPowers · actualizado 29 oct 2026</text>

  <g>
    <rect x="32" y="64" width="172" height="96" rx="12" fill="#1f2335" stroke="#2a2e45"/>
    <text x="118" y="112" class="n" text-anchor="middle">49</text>
    <text x="118" y="140" class="l" text-anchor="middle">Contribuciones (1 año)</text>
  </g>
  <g>
    <rect x="218" y="64" width="172" height="96" rx="12" fill="#1f2335" stroke="#2a2e45"/>
    <text x="304" y="112" class="n" text-anchor="middle">3</text>
    <text x="304" y="140" class="l" text-anchor="middle">Racha actual (días)</text>
  </g>
  <g>
    <rect x="404" y="64" width="172" height="96" rx="12" fill="#1f2335" stroke="#2a2e45"/>
    <text x="490" y="112" class="n" text-anchor="middle">3</text>
    <text x="490" y="140" class="l" text-anchor="middle">Racha más larga (días)</text>
  </g>
  <g>
    <rect x="590" y="64" width="178" height="96" rx="12" fill="#1f2335" stroke="#2a2e45"/>
    <text x="679" y="112" class="n" text-anchor="middle">4</text>
    <text x="679" y="140" class="l" text-anchor="middle">Repositorios públicos</text>
  </g>

  <text x="32" y="198" class="l">Lenguajes principales (por repositorio)</text>
  <clipPath id="bar"><rect x="32" y="210" width="736" height="12" rx="6"/></clipPath>
  <g clip-path="url(#bar)">
    <rect x="32" y="210" width="368" height="12" fill="#7aa2f7"/>
    <rect x="400" y="210" width="368" height="12" fill="#9ece6a"/>
  </g>
  <circle cx="40" cy="246" r="5" fill="#7aa2f7"/>
  <text x="54" y="250" class="l">Python 50%</text>
  <circle cx="170" cy="246" r="5" fill="#9ece6a"/>
  <text x="184" y="250" class="l">Shell 50%</text>
